<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<script>
  // GitHub Pages serves this file for unknown paths. Deep links into the
  // /myBooks app (e.g. /myBooks/some-book) are handed to the app, which
  // restores the original URL. Matching is case-insensitive (/mybooks works).
  (function () {
    var p = location.pathname;
    if (/^\/mybooks(\/|$)/i.test(p)) {
      try {
        sessionStorage.setItem('mybooks:redirect', '/myBooks' + p.slice(8) + location.search + location.hash);
      } catch (e) {}
      location.replace('/myBooks/');
    }
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f7f5f1; color: #232019; text-align: center; padding: 24px; }
  a { color: #b5623a; }
  @media (prefers-color-scheme: dark) { body { background: #1a1713; color: #f0ece3; } a { color: #e8a67c; } }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="/">Go to the home page</a></p>
  </main>
</body>
</html>
